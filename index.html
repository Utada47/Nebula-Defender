<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula Defender</title>
<style>
:root{--bg:#0b1020;--fg:#e8ecff;--mut:#8f9bc7;--acc:#5ef0c8;--acc2:#ff6b9a;--card:#151c36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e8ecff;--mut:#8f9bc7;--card:#151c36}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e8ecff;--mut:#8f9bc7;--card:#151c36}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1ff;--fg:#141a3a;--mut:#5a6591;--card:#fff;--acc:#0a9f7c;--acc2:#d6336c}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;overflow:hidden;touch-action:none;user-select:none}
#hud{width:min(100%,480px);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;gap:8px}
#hud span{background:var(--card);padding:5px 10px;border-radius:999px;white-space:nowrap}
#hud b{color:var(--acc)}
#wrap{position:relative;flex:1;min-height:0;width:100%;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:2/3;background:#050814;border-radius:14px;border:1px solid rgba(120,140,255,.3);cursor:crosshair}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#card{pointer-events:auto;background:var(--card);border-radius:18px;padding:22px;width:min(86%,340px);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
p{margin:6px 0;color:var(--mut);font-size:13px;line-height:1.5}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;margin:4px;cursor:pointer;background:var(--acc);color:#04120d}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--mut)}
button.sel{outline:3px solid var(--acc2)}
.row{display:flex;justify-content:center;flex-wrap:wrap}
.pw{font-size:12px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<div id="hud"><span>Skor <b id="s">0</b></span><span>Gelombang <b id="w">1</b></span><span id="l">❤❤❤</span><span>Rekor <b id="hs">0</b></span></div>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas><div id="ov"><div id="card"></div></div></div>
<div id="hud" style="justify-content:center"><span id="pu">Gerak: mouse / sentuh / WASD · Spasi: bom · P: jeda</span><button class="alt" id="mu" style="padding:5px 10px;margin:0">🔊</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=720;
const $=id=>document.getElementById(id);
let mode='menu',diff=1,score=0,wave=0,hi=0,last=0,t=0,shake=0,combo=1,comboT=0,muted=false,AC=null;
try{hi=+localStorage.getItem('nd_hi')||0}catch(e){}
$('hs').textContent=hi;
let P,bul,ebul,en,pw,pa,stars,spawnLeft,spawnT,waveT,bombs;
const rnd=(a,b)=>a+Math.random()*(b-a);
function beep(f,d,ty='square',v=.04){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.value=f;gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function init(){P={x:W/2,y:H-90,tx:W/2,ty:H-90,hp:3,sh:0,tri:0,rap:0,cd:0,inv:0};bul=[];ebul=[];en=[];pw=[];pa=[];score=0;wave=0;combo=1;bombs=1;spawnLeft=0;waveT=60;
stars=Array.from({length:70},()=>({x:rnd(0,W),y:rnd(0,H),z:rnd(.3,2)}));hud()}
function hud(){$('s').textContent=score;$('w').textContent=Math.max(1,wave);$('l').textContent='❤'.repeat(Math.max(0,P.hp))+' 💣'+bombs;
const a=[];if(P.sh>0)a.push('Perisai');if(P.tri>0)a.push('Tembak 3');if(P.rap>0)a.push('Cepat');
$('pu').textContent=a.length?'Aktif: '+a.join(' · ')+(combo>1?' · Kombo x'+combo:''):(combo>1?'Kombo x'+combo:'Gerak: mouse / sentuh / WASD · Spasi: bom · P: jeda')}
function card(h,body,btns){$('card').innerHTML='<h1>'+h+'</h1>'+body+'<div class="row">'+btns+'</div>';$('card').parentElement.style.display='flex'}
function menu(){mode='menu';card('Nebula Defender','<p>Pertahankan galaksi dari serbuan alien. Kumpulkan power-up, bangun kombo, dan kalahkan bos tiap 5 gelombang.</p><p>Tingkat kesulitan:</p>','<button class="alt'+(diff==.8?' sel':'')+'" onclick="setD(.8)">Santai</button><button class="alt'+(diff==1?' sel':'')+'" onclick="setD(1)">Normal</button><button class="alt'+(diff==1.3?' sel':'')+'" onclick="setD(1.3)">Sulit</button><br><button onclick="start()">▶ Main</button>')}
function setD(d){diff=d;menu()}
function start(){init();mode='play';$('ov').style.display='none';beep(520,.15,'sine')}
function over(){mode='over';if(score>hi){hi=score;try{localStorage.setItem('nd_hi',hi)}catch(e){}}$('hs').textContent=hi;$('ov').style.display='flex';card('Game Over','<p>Skor akhir: <b style="color:var(--acc)">'+score+'</b> · Gelombang '+wave+'</p><p>'+(score>=hi&&score>0?'Rekor baru! 🎉':'Rekor: '+hi)+'</p>','<button onclick="start()">Main lagi</button><button class="alt" onclick="menu()">Menu</button>')}
function pause(){if(mode=='play'){mode='pause';$('ov').style.display='flex';card('Jeda','<p>Tekan P atau lanjutkan.</p>','<button onclick="resume()">Lanjut</button><button class="alt" onclick="menu()">Menu</button>')}else if(mode=='pause')resume()}
function resume(){mode='play';$('ov').style.display='none';last=performance.now()}
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊'};
function nextWave(){wave++;const boss=wave%5==0;spawnLeft=boss?1:Math.floor((6+wave*3)*(diff>1?1.2:1));spawnT=0;if(boss){en.push({ty:3,x:W/2,y:-60,vx:1.5*diff,vy:1,hp:40+wave*6,mhp:40+wave*6,r:42,cd:40,ph:0,sc:2000});spawnLeft=0}hud()}
function spawn(){const r=Math.random(),ty=wave<2?0:r<.5?0:r<.8?1:2;
const e={ty,x:rnd(30,W-30),y:-30,ph:rnd(0,6),cd:rnd(40,120),vx:0,vy:(1.3+wave*.08)*diff,hp:1,r:15,sc:100};
if(ty==1){e.hp=2;e.sc=200;e.r=16}if(ty==2){e.hp=6;e.sc=400;e.r=22;e.vy*=.55}e.mhp=e.hp;en.push(e)}
function boom(x,y,col,n=14){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(1,5);pa.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(20,45),c:col})}}
function drop(x,y){if(Math.random()<.14){const k=['T','R','S','H'][Math.floor(rnd(0,4))];pw.push({x,y,k})}}
function hurt(){if(P.inv>0)return;if(P.sh>0){P.sh=0;P.inv=40;beep(200,.2,'sawtooth');boom(P.x,P.y,'#5ef0c8');return}
P.hp--;P.inv=100;shake=14;combo=1;beep(110,.4,'sawtooth',.07);boom(P.x,P.y,'#ff6b9a',24);hud();if(P.hp<=0)over()}
function kill(e){score+=e.sc*combo;combo=Math.min(8,combo+1);comboT=120;boom(e.x,e.y,e.ty==3?'#ffd166':'#ff9f43',e.ty==3?60:16);drop(e.x,e.y);beep(e.ty==3?90:260,.2,'triangle');if(e.ty==3){shake=25;P.hp=Math.min(5,P.hp+1)}hud()}
function bomb(){if(bombs<=0||mode!='play')return;bombs--;shake=20;beep(70,.6,'sawtooth',.08);ebul.length=0;for(const e of en){e.hp-=e.ty==3?10:99;boom(e.x,e.y,'#fff',6);}for(let i=en.length-1;i>=0;i--)if(en[i].hp<=0){kill(en[i]);en.splice(i,1)}hud()}
function update(f){
t+=f;if(shake>0)shake-=f;
P.x+=(P.tx-P.x)*.25*f;P.y+=(P.ty-P.y)*.25*f;P.x=Math.max(20,Math.min(W-20,P.x));P.y=Math.max(40,Math.min(H-30,P.y));
if(P.inv>0)P.inv-=f;if(P.sh>0)P.sh-=f*.2;if(P.tri>0)P.tri-=f;if(P.rap>0)P.rap-=f;
if(comboT>0){comboT-=f;if(comboT<=0){combo=1;hud()}}
P.cd-=f;if(P.cd<=0){P.cd=P.rap>0?5:10;const sp=-11;bul.push({x:P.x,y:P.y-18,vx:0,vy:sp});
if(P.tri>0){bul.push({x:P.x-8,y:P.y-12,vx:-2.2,vy:sp});bul.push({x:P.x+8,y:P.y-12,vx:2.2,vy:sp})}beep(880,.04,'square',.015)}
if(spawnLeft>0){spawnT-=f;if(spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(18,50-wave*2)/diff}}
else if(en.length==0){waveT-=f;if(waveT<=0){nextWave();waveT=90}}
for(const s of stars){s.y+=s.z*f*1.2;if(s.y>H){s.y=0;s.x=rnd(0,W)}}
for(const b of bul){b.x+=b.vx*f;b.y+=b.vy*f}bul=bul.filter(b=>b.y>-20&&b.x>-10&&b.x<W+10);
for(const b of ebul){b.x+=b.vx*f;b.y+=b.vy*f}ebul=ebul.filter(b=>b.y<H+20&&b.x>-20&&b.x<W+20&&b.y>-40);
for(const e of en){e.ph+=.05*f;e.cd-=f;
if(e.ty==0)e.y+=e.vy*f;
else if(e.ty==1){e.y+=e.vy*f;e.x+=Math.sin(e.ph*1.5)*3*f}
else if(e.ty==2){e.y+=e.vy*f;if(e.y>110)e.y-=e.vy*f;e.x+=Math.sin(e.ph)*1.2*f;if(e.cd<=0){e.cd=90/diff;aim(e,3.2)}}
else{if(e.y<90)e.y+=e.vy*f;e.x+=e.vx*f;if(e.x<60||e.x>W-60)e.vx*=-1;
if(e.cd<=0){e.cd=55/diff;for(let k=-2;k<=2;k++)ebul.push({x:e.x,y:e.y+30,vx:k*1.4,vy:3.4})}}
if(e.ty==1&&e.cd<=0){e.cd=140/diff;ebul.push({x:e.x,y:e.y+10,vx:0,vy:4})}
if(Math.hypot(e.x-P.x,e.y-P.y)<e.r+12){if(e.ty!=3){e.hp=0;kill(e)}hurt()}
if(e.y>H+40){e.hp=0;e.esc=1;combo=1}}
for(const b of bul)for(const e of en)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp--;b.y=-99;e.fl=4;boom(b.x,b.y,'#fff',2);if(e.hp<=0)kill(e)}
en=en.filter(e=>e.hp>0);
for(const b of ebul)if(Math.hypot(b.x-P.x,b.y-P.y)<11){b.y=H+99;hurt()}
for(const p of pw){p.y+=1.6*f;if(Math.hypot(p.x-P.x,p.y-P.y)<24){p.y=H+99;beep(1200,.12,'sine');
if(p.k=='T')P.tri=600;if(p.k=='R')P.rap=600;if(p.k=='S')P.sh=400;if(p.k=='H'){P.hp=Math.min(5,P.hp+1);bombs=Math.min(3,bombs+1)}hud()}}
pw=pw.filter(p=>p.y<H+30);
for(const p of pa){p.x+=p.vx*f;p.y+=p.vy*f;p.l-=f}pa=pa.filter(p=>p.l>0);
}
function aim(e,s){const a=Math.atan2(P.y-e.y,P.x-e.x);ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s})}
const COL=['#ff6b9a','#ffd166','#a78bfa','#ff5d5d'];
function draw(){
g.save();g.clearRect(0,0,W,H);
if(shake>0)g.translate(rnd(-4,4),rnd(-4,4));
for(const s of stars){g.fillStyle='rgba(200,215,255,'+(.2+s.z*.3)+')';g.fillRect(s.x,s.y,s.z,s.z*2)}
for(const p of pw){g.fillStyle={T:'#ffd166',R:'#5ef0c8',S:'#60a5fa',H:'#ff6b9a'}[p.k];g.beginPath();g.arc(p.x,p.y,11,0,6.3);g.fill();g.fillStyle='#050814';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(p.k,p.x,p.y+5)}
g.fillStyle='#5ef0c8';for(const b of bul)g.fillRect(b.x-2,b.y-8,4,14);
g.fillStyle='#ff9f9f';for(const b of ebul){g.beginPath();g.arc(b.x,b.y,5,0,6.3);g.fill()}
for(const e of en){g.save();g.translate(e.x,e.y);g.fillStyle=e.fl>0?(e.fl--,'#fff'):COL[e.ty];
if(e.ty==0){g.beginPath();g.moveTo(0,16);g.lineTo(-15,-12);g.lineTo(0,-4);g.lineTo(15,-12);g.fill()}
else if(e.ty==1){g.beginPath();g.moveTo(0,-16);g.lineTo(16,0);g.lineTo(0,16);g.lineTo(-16,0);g.fill();g.fillStyle='#050814';g.fillRect(-4,-3,8,6)}
else if(e.ty==2){g.beginPath();g.arc(0,0,22,0,6.3);g.fill();g.fillStyle='#050814';g.beginPath();g.arc(0,0,9,0,6.3);g.fill();g.fillStyle=COL[2];g.fillRect(-4,-4,8,8)}
else{g.beginPath();g.ellipse(0,0,46,26,0,0,6.3);g.fill();g.fillStyle='#050814';g.beginPath();g.arc(0,-4,14,0,6.3);g.fill();g.fillStyle='#ff5d5d';g.fillRect(-60+0,-52,0,0)}
g.restore();
if(e.mhp>1){g.fillStyle='rgba(255,255,255,.2)';g.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,4);g.fillStyle='#5ef0c8';g.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*e.hp/e.mhp,4)}}
if(mode!='over'&&!(P.inv>0&&Math.floor(t/4)%2)){g.save();g.translate(P.x,P.y);
g.fillStyle='#ffb347';g.beginPath();g.moveTo(-6,16);g.lineTo(0,16+rnd(8,18));g.lineTo(6,16);g.fill();
g.fillStyle='#e8ecff';g.beginPath();g.moveTo(0,-20);g.lineTo(16,16);g.lineTo(0,9);g.lineTo(-16,16);g.fill();g.fillStyle='#5ef0c8';g.fillRect(-2,-6,4,9);
if(P.sh>0){g.strokeStyle='rgba(96,165,250,.8)';g.lineWidth=2;g.beginPath();g.arc(0,0,28,0,6.3);g.stroke()}g.restore()}
for(const p of pa){g.globalAlpha=Math.min(1,p.l/25);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
if(mode=='play'&&spawnLeft==0&&en.length==0&&waveT>0){g.fillStyle='rgba(232,236,255,.9)';g.font='bold 28px system-ui';g.textAlign='center';g.fillText((wave+1)%5==0?'BOS DATANG!':'Gelombang '+(wave+1),W/2,H/2)}
g.restore()}
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(mode=='play')update(dt*60);draw();requestAnimationFrame(loop)}
function pos(e){const r=cv.getBoundingClientRect();P&&(P.tx=(e.clientX-r.left)/r.width*W,P.ty=(e.clientY-r.top)/r.height*H-(e.pointerType=='touch'?60:0))}
cv.addEventListener('pointermove',e=>{if(mode=='play')pos(e)});
cv.addEventListener('pointerdown',e=>{if(mode=='play')pos(e)});
cv.addEventListener('dblclick',bomb);
const K={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='p'||k=='escape')pause();if(k==' '){e.preventDefault();bomb()}K[k]=1});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
setInterval(()=>{if(mode!='play')return;const s=9;
if(K.arrowleft||K.a)P.tx-=s;if(K.arrowright||K.d)P.tx+=s;if(K.arrowup||K.w)P.ty-=s;if(K.arrowdown||K.s)P.ty+=s;
P.tx=Math.max(20,Math.min(W-20,P.tx));P.ty=Math.max(40,Math.min(H-30,P.ty))},16);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode=='play')pause()});
init();menu();requestAnimationFrame(loop);
</script>
</body>
</html>
