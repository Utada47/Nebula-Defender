
services:

  nginx:
    image: nginx:1.27
    container_name: web-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - web-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-php
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_NAME: db_testing
      DB_USER: testuser
      DB_PASS: Test123
      SCENARIO: Docker Nginx
    volumes:
      - ./src:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - web-network

  mariadb:
    image: mariadb:11
    container_name: web-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: Root123
      MARIADB_DATABASE: db_testing
      MARIADB_USER: testuser
      MARIADB_PASSWORD: Test123
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  mariadb_data:
